services:
  - type: web
    name: phages-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false   # set in Render dashboard
      - key: CORS_ORIGINS
        value: "https://apriwilder.github.io,https://your-wordpress-domain.com,*"
      - key: DEFAULT_TOPK
        value: "6"
      - key: DEFAULT_MAX_CTX_TOK
        value: "2000"
    healthCheckPath: /health
    autoDeploy: true
